name: Build BIST AI Trader v5.1 - Signal Balance Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/**'
      - 'project/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project extracted_bundle
          mkdir -p project extracted_bundle

          if [ -f app/build.gradle ]; then
            echo "WORKDIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -f project/app/build.gradle ]; then
            echo "WORKDIR=project" >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP="$(find . -maxdepth 1 -type f -iname 'BIST_AI_Trader_V5_ALL_FEATURES*.zip' | sort | head -n1 || true)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: V5 ZIP bulunamadı."
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Outer archive: $ZIP"
          unzip -q "$ZIP" -d extracted_bundle

          if [ -f extracted_bundle/settings.gradle ] && [ -f extracted_bundle/app/build.gradle ]; then
            cp -a extracted_bundle/. project/
          else
            INNER="$(find extracted_bundle -type f -iname 'BIST_AI_Trader_V5_ALL_FEATURES*.zip' | sort | head -n1 || true)"
            if [ -z "$INNER" ]; then
              echo "ERROR: Outer bundle içinde Android proje ZIP'i bulunamadı."
              find extracted_bundle -maxdepth 4 -type f -print
              exit 1
            fi
            echo "Inner project archive: $INNER"
            unzip -q "$INNER" -d project
          fi

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml
          echo "WORKDIR=project" >> "$GITHUB_ENV"
          echo "Android project located successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | sort | tail -n1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager bulunamadı."
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Java source preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          grep -q "versionName '5.1'" app/build.gradle
          test -f app/src/main/java/com/bistaitrader/AnalysisEngine.java
          test -f app/src/main/java/com/bistaitrader/PredictionStore.java
          grep -q 'int w=0,l=0' app/src/main/java/com/bistaitrader/PredictionStore.java
          grep -q 'decisionWhy' app/src/main/java/com/bistaitrader/AnalysisEngine.java
          grep -q 'AL ADAYI' app/src/main/java/com/bistaitrader/AnalysisEngine.java
          grep -q 'NEDEN ' app/src/main/java/com/bistaitrader/MainActivity.java
          if grep -RIn --include='*.java' 'Locale\.TR' app/src/main/java; then exit 1; fi
          if grep -RIn --include='*.java' '%0\.2f' app/src/main/java; then exit 1; fi
          echo "Java preflight OK"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          gradle clean :app:assembleDebug --stacktrace --no-daemon --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$WORKDIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIST_AI_Trader_v5_1_signal_balance_fix_debug
          path: ${{ env.WORKDIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
