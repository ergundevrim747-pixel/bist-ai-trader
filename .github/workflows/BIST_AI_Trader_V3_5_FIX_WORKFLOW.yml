name: BIST AI Trader V3.5 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project

          unzip -q \
            BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip \
            -d project

      - name: Locate project
        run: |
          if [ -f project/settings.gradle ] || [ -f project/settings.gradle.kts ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "Android projesi bulunamadı!"
              exit 1
            fi

            echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          fi

      # =========================================================
      # PredictionStore.java - JSONException FIX
      # =========================================================

      - name: Fix PredictionStore
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(Path("project").rglob("PredictionStore.java"))

          if not files:
              print("PredictionStore.java bulunamadı!")
              raise SystemExit(1)

          path = files[0]

          print("Düzeltilen dosya:")
          print(path)

          text = path.read_text(encoding="utf-8")

          # -----------------------------------------------------
          # 1. JSONException import'u garanti et
          # -----------------------------------------------------

          if "import org.json.JSONException;" not in text:
              text = text.replace(
                  "import org.json.JSONObject;",
                  "import org.json.JSONObject;\nimport org.json.JSONException;"
              )

          # -----------------------------------------------------
          # 2. write/update yapan metodun içine try/catch eklemek
          # -----------------------------------------------------

          # Sorunlu p.put(...) satırlarını tek tek güvenli hale getir.
          replacements = {
              r'p\.put"lastQuote",\s*price;':
                  'try { p.put("lastQuote", price); } catch (JSONException ignored) {}',

              r'p\.put"lastQuoteTime",\s*now;':
                  'try { p.put("lastQuoteTime", now); } catch (JSONException ignored) {}',

              r'p\.put"maxFavPct",\s*Math\.max\((.*?);':
                  r'try { p.put("maxFavPct", Math.max(\1); } catch (JSONException ignored) {}',

              r'p\.put"maxAdvPct",\s*Math\.min\((.*?);':
                  r'try { p.put("maxAdvPct", Math.min(\1); } catch (JSONException ignored) {}'
          }

          for pattern, replacement in replacements.items():
              text = re.sub(pattern, replacement, text)

          # -----------------------------------------------------
          # 3. Eğer hâlâ optString/optDouble değil put() problemi
          #    varsa bütün p.put çağrılarını güvenli hale getir.
          # -----------------------------------------------------

          lines = text.splitlines()

          fixed = []

          for line in lines:
              stripped = line.strip()

              if "p.put(" in stripped and "try {" not in stripped:
                  indent = line[:len(line)-len(line.lstrip())]

                  # Basit tek satırlık p.put()
                  if stripped.endswith(";"):
                      statement = stripped

                      fixed.append(
                          indent +
                          "try { " +
                          statement +
                          " } catch (JSONException ignored) {}"
                      )
                      continue

              fixed.append(line)

          text = "\n".join(fixed) + "\n"

          path.write_text(text, encoding="utf-8")

          print("PredictionStore düzeltmesi uygulandı.")

          PY

      # =========================================================
      # Dosyayı göster - hatanın gerçekten düzeldiğini kontrol et
      # =========================================================

      - name: Show PredictionStore
        run: |
          echo "========================================"
          echo "PredictionStore.java"
          echo "========================================"

          sed -n '55,85p' \
            project/app/src/main/java/com/bistaitrader/PredictionStore.java

          echo "========================================"

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean --stacktrace --no-daemon
          else
            gradle clean --stacktrace --no-daemon
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug \
             