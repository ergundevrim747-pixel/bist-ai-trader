name: BIST AI Trader V3.5 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. GitHub repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true


      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ---------------------------------------------------------
      # 4. Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ---------------------------------------------------------
      # 5. V3.5 ZIP dosyasını aç
      # ---------------------------------------------------------
      - name: Extract V3.5 project
        run: |
          rm -rf project
          mkdir -p project

          if [ ! -f "BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip" ]; then
            echo "V3.5 ZIP bulunamadı!"
            echo ""
            echo "Repository içeriği:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          unzip -q \
            "BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip" \
            -d project

          echo "ZIP başarıyla açıldı."


      # ---------------------------------------------------------
      # 6. Android projesini bul
      # ---------------------------------------------------------
      - name: Locate Android project
        run: |
          echo "Project contents:"
          find project -maxdepth 5 -type f | sort | head -300

          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            exit 0
          fi

          SETTINGS=$(find project -maxdepth 5 \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android proje klasörü: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 7. Gradle wrapper
      # ---------------------------------------------------------
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper bulundu."
          else
            echo "Gradle wrapper bulunamadı."
            echo "Sistem Gradle kullanılacak."
          fi


      # ---------------------------------------------------------
      # 8. PredictionStore JSONException düzeltmesi
      # ---------------------------------------------------------
      - name: Fix PredictionStore JSONException
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = list(Path("project").rglob("PredictionStore.java"))

          if not files:
              print("PredictionStore.java bulunamadı.")
              raise SystemExit(1)

          path = files[0]

          print("PredictionStore bulundu:")
          print(path)

          text = path.read_text(encoding="utf-8")

          # JSONException import'u
          if "import org.json.JSONException;" not in text:
              if "import org.json.JSONObject;" in text:
                  text = text.replace(
                      "import org.json.JSONObject;",
                      "import org.json.JSONObject;\nimport org.json.JSONException;"
                  )
              else:
                  text = text.replace(
                      "package com.bistaitrader;",
                      "package com.bistaitrader;\n\nimport org.json.JSONException;"
                  )

          # -----------------------------------------------------
          # p.put() çağrılarını güvenli hale getir
          # -----------------------------------------------------

          lines = text.splitlines()
          result = []

          for line in lines:
              stripped = line.strip()

              if "p.put(" in stripped and not stripped.startswith("try"):
                  indent = line[:len(line) - len(line.lstrip())]

                  if stripped.endswith(";"):