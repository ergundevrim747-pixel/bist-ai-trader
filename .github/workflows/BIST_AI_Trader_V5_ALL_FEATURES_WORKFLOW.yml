name: Build BIST AI Trader v5

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/**'
      - 'project/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle ]; then
            echo "WORKDIR=." >> "$GITHUB_ENV"
          elif [ -f project/app/build.gradle ]; then
            echo "WORKDIR=project" >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 1 -type f -iname 'BIST_AI_Trader_V5_ALL_FEATURES*.zip' | head -n1 || true)
            if [ -z "$ZIP" ]; then echo 'BIST_AI_Trader_V5 zip bulunamadı veya app/build.gradle yok.'; exit 1; fi
            rm -rf project && mkdir project
            unzip -q "$ZIP" -d project
            echo "WORKDIR=project" >> "$GITHUB_ENV"
          fi
          echo "Build directory: ${WORKDIR:-project}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | sort | tail -n1 || true)
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "${SDKMANAGER:-}" ]; then
            echo 'ERROR: sdkmanager bulunamadı.'
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          grep -q "versionName '5.0'" app/build.gradle

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIST_AI_Trader_v5_debug
          path: ${{ env.WORKDIR }}/app/build/outputs/apk/debug/*.apk
