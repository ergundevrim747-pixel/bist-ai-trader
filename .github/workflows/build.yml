name: BIST AI Trader V3.5 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. GitHub repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Locate sdkmanager
        run: |
          set -euo pipefail

          # ANDROID_HOME ve ANDROID_SDK_ROOT'u eşitle (bazı pluginler
          # sadece birini okuyor)
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT tanımlı değil!"
            exit 1
          fi

          # "latest" klasörü olmayabilir; cmdline-tools altında
          # sdkmanager'ı ara.
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name "sdkmanager" -print -quit || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadı! cmdline-tools içeriği:"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdkmanager bulundu: $SDKMANAGER"


      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses || true


      - name: Install Android SDK
        run: |
          set -euo pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ---------------------------------------------------------
      # 4. Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ---------------------------------------------------------
      # 5. V3.5 ZIP dosyasını aç
      # ---------------------------------------------------------
      - name: Extract V3.5 project
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project

          if [ ! -f "BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip" ]; then
            echo "V3.5 ZIP bulunamadı!"
            echo ""
            echo "Repository içeriği:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          unzip -q \
            "BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip" \
            -d project

          echo "ZIP başarıyla açıldı."


      # ---------------------------------------------------------
      # 6. Android projesini bul
      # ---------------------------------------------------------
      - name: Locate Android project
        run: |
          set -euo pipefail
          echo "Project contents:"
          find project -maxdepth 5 -type f | sort | head -300

          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            exit 0
          fi

          SETTINGS=$(find project -maxdepth 5 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android proje klasörü: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 7. Gradle wrapper
      # ---------------------------------------------------------
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper bulundu."
          else
            echo "Gradle wrapper bulunamadı."
            echo "Sistem Gradle kullanılacak."
          fi


      # ---------------------------------------------------------
      # 8. Android application modülünü bul (app olmayabilir)
      # ---------------------------------------------------------
      - name: Locate application module
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          BUILD_FILE=$(grep -rl --include="build.gradle" --include="build.gradle.kts" \
            -e "com\.android\.application" . | head -n 1 || true)

          if [ -z "$BUILD_FILE" ]; then
            echo "com.android.application plugin'i içeren bir modül bulunamadı!"
            echo "Bulunan build.gradle dosyaları:"
            find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \)
            exit 1
          fi

          MODULE_DIR=$(dirname "$BUILD_FILE")
          MODULE_DIR=${MODULE_DIR#./}

          if [ -z "$MODULE_DIR" ] || [ "$MODULE_DIR" = "." ]; then
            GRADLE_MODULE=""
          else
            GRADLE_MODULE=":${MODULE_DIR//\//:}"
          fi

          echo "Application modülü: ${GRADLE_MODULE:-<root>}"
          echo "GRADLE_MODULE=$GRADLE_MODULE" >> "$GITHUB_ENV"
          echo "MODULE_DIR=$MODULE_DIR" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 9. PredictionStore JSONException düzeltmesi
      # ---------------------------------------------------------
      - name: Fix PredictionStore JSONException
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          files = list(Path("project").rglob("PredictionStore.java"))

          if not files:
              print("PredictionStore.java bulunamadı.")
              raise SystemExit(1)

          path = files[0]
          print("PredictionStore bulundu:")
          print(path)

          text = path.read_text(encoding="utf-8")

          # JSONException import'u ekle (yoksa)
          if "import org.json.JSONException;" not in text:
              if "import org.json.JSONObject;" in text:
                  text = text.replace(
                      "import org.json.JSONObject;",
                      "import org.json.JSONObject;\nimport org.json.JSONException;",
                      1,
                  )
              else:
                  text = re.sub(
                      r"(package\s+[\w.]+;)",
                      r"\1\n\nimport org.json.JSONException;",
                      text,
                      count=1,
                  )

          # p.put(...) çağrılarını try/catch ile sar.
          # - Zaten sarılmış olan satırları (try { ... } catch...) atla (idempotent).
          # - Satır sonunda yorum olsa da yakala.
          # - Aynı satırda birden fazla p.put() varsa hepsini kapsa.
          pattern = re.compile(
              r'^(?P<indent>\s*)(?P<code>.*\bp\.put\(.*\);)(?P<trail>\s*(?://.*)?)$'
          )

          out_lines = []
          changed = 0
          for line in text.splitlines():
              stripped = line.strip()

              if not stripped.startswith("p.put(") and "p.put(" not in stripped:
                  out_lines.append(line)
                  continue

              if stripped.startswith("try") or stripped.startswith("try{") or "catch (JSONException" in stripped:
                  out_lines.append(line)
                  continue

              m = pattern.match(line)
              if not m:
                  out_lines.append(line)
                  continue

              indent = m.group("indent")
              code = m.group("code")
              trail = m.group("trail")
              out_lines.append(
                  f"{indent}try {{ {code} }} catch (JSONException ignored) {{}}{trail}"
              )
              changed += 1

          text = "\n".join(out_lines) + "\n"
          path.write_text(text, encoding="utf-8")

          print(f"PredictionStore düzeltmesi uygulandı. Değiştirilen satır sayısı: {changed}")

          PY


      # ---------------------------------------------------------
      # 10. PredictionStore kontrol
      # ---------------------------------------------------------
      - name: Show PredictionStore
        run: |
          echo "=========================================="
          echo "PredictionStore.java"
          echo "=========================================="

          find project -name "PredictionStore.java" -print

          FILE=$(find project -name "PredictionStore.java" -print -quit)

          if [ -n "$FILE" ]; then
            echo ""
            echo "55-90. satırlar:"
            nl -ba "$FILE" | sed -n '55,90p'
          fi

          echo "=========================================="


      # ---------------------------------------------------------
      # 11. Gradle temizleme
      # ---------------------------------------------------------
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          if [ -f "./gradlew" ]; then
            ./gradlew clean --stacktrace --no-daemon
          else
            gradle clean --stacktrace --no-daemon
          fi


      # ---------------------------------------------------------
      # 12. APK BUILD
      # ---------------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          TASK="${GRADLE_MODULE}:assembleDebug"

          if [ -f "./gradlew" ]; then
            ./gradlew "$TASK" --stacktrace --no-daemon
          else
            gradle "$TASK" --stacktrace --no-daemon
          fi


      # ---------------------------------------------------------
      # 13. APK kontrolü
      # ---------------------------------------------------------
      - name: Find APK
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "APK DOSYALARI"
          echo "=========================================="

          SEARCH_DIR="${PROJECT_DIR}/${MODULE_DIR:-app}/build/outputs"

          find "$SEARCH_DIR" -type f -name "*.apk" -print || true

          if ! find "$SEARCH_DIR" -type f -name "*.apk" | grep -q .; then
            echo ""
            echo "APK oluşturulamadı!"
            exit 1
          fi

          echo "APK_DIR=${SEARCH_DIR}/apk/debug" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 14. APK'yı GitHub Actions'a yükle
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIST-AI-Trader-V3.5-FIXED-APK
          path: |
            ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 30
