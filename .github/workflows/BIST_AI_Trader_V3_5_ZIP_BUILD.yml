name: BIST AI Trader V3.5 - Runtime Fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1 - Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2 - Java 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3 - Android projesini ZIP'ten çıkar
      # ==========================================
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="BIST_AI_Trader_V3_5_RUNTIME_FIX.zip"

          echo "=========================================="
          echo "ZIP KONTROLÜ"
          echo "=========================================="

          test -f "$ZIP"

          echo "ZIP bulundu:"
          ls -lh "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo ""
          echo "Proje dosyaları:"
          find project -maxdepth 2 -type f | sort | head -100

          echo ""
          echo "Gradle dosyaları kontrol ediliyor..."

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

          echo ""
          echo "ANDROID PROJECT OK"


      # ==========================================
      # 4 - Android SDK
      # ==========================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"

          else
            echo "HATA: sdkmanager bulunamadı."
            exit 1
          fi

          echo ""
          echo "Kullanılan sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Android lisansları kabul ediliyor..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Gerekli Android paketleri kuruluyor..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "ANDROID SDK OK"


      # ==========================================
      # 5 - Gradle 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==========================================
      # 6 - Java kaynak kontrolü
      # ==========================================
      - name: Java source preflight
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "JAVA KAYNAK KONTROLÜ"
          echo "=========================================="

          echo ""
          echo "Locale.TR kontrolü..."

          if grep -RIn --include='*.java' 'Locale\.TR' app/src/main/java; then
            echo "HATA: Locale.TR bulundu."
            exit 1
          fi

          echo "OK - Locale.TR bulunamadı."

          echo ""
          echo "PredictionStore kontrolü..."

          test -f \
            app/src/main/java/com/bistaitrader/PredictionStore.java

          grep -q 'putQuiet' \
            app/src/main/java/com/bistaitrader/PredictionStore.java

          echo "OK - PredictionStore."

          echo ""
          echo "MainActivity kontrolü..."

          test -f \
            app/src/main/java/com/bistaitrader/MainActivity.java

          echo "MarketGroups.matches kullanımları:"
          grep -n "MarketGroups.matches" \
            app/src/main/java/com/bistaitrader/MainActivity.java || true

          echo ""
          echo "Format kontrolü..."

          if grep -RIn --include='*.java' '%0\.2f' app/src/main/java; then
            echo "HATA: Geçersiz %0.2f formatı bulundu."
            exit 1
          fi

          echo "OK - %0.2f bulunamadı."

          echo ""
          echo "=========================================="
          echo "JAVA PREFLIGHT OK"
          echo "=========================================="


      # ==========================================
      # 7 - Runtime format kontrolü
      # ==========================================
      - name: Verify runtime format fix
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/bistaitrader/MainActivity.java"

          echo "MainActivity formatları:"
          grep -nE 'String\.format|%.2f|%[0-9.]*f' "$FILE" || true

          echo ""
          echo "Runtime format kontrolü tamamlandı."


      # ==========================================
      # 8 - Gradle Clean
      # ==========================================
      - name: Clean project
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GRADLE CLEAN"
          echo "=========================================="

          gradle clean \
            --stacktrace \
            --no-daemon

          echo ""
          echo "CLEAN OK"


      # ==========================================
      # 9 - Debug APK Build
      # ==========================================
      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BIST AI TRADER V3.5"
          echo "APK BUILD BAŞLIYOR"
          echo "=========================================="

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

          echo ""
          echo "=========================================="
          echo "BUILD TAMAMLANDI"
          echo "=========================================="


      # ==========================================
      # 10 - APK kontrol
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          echo "APK kontrol ediliyor..."

          test -f "$APK"
          test -s "$APK"

          echo ""
          echo "=========================================="
          echo "APK BAŞARIYLA OLUŞTURULDU"
          echo "=========================================="

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"


      # ==========================================
      # 11 - APK Artifact
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIST-AI-Trader-V3.5-RUNTIME-FIX-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # 12 - Başarılı build özeti
      # ==========================================
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "BIST AI TRADER V3.5"
          echo "BUILD BAŞARILI"
          echo "=========================================="
          echo ""
          echo "APK:"
          echo "app-debug.apk"
          echo ""
          echo "Artifact:"
          echo "BIST-AI-Trader-V3.5-RUNTIME-FIX-APK"
          echo ""
          echo "GitHub Actions > Artifacts bölümünden"
          echo "APK'yı indirebilirsin."