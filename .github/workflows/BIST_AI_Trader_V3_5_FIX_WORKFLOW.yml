name: BIST AI Trader V3.5 Build - FIX JSONException

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract V3.5 project
        run: |
          rm -rf project
          mkdir -p project
          if [ -f "BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip" ]; then
            unzip -q "BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip" -d project
          else
            echo "V3.5 ZIP bulunamadı!"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Locate Android project
        run: |
          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            SETTINGS=$(find project -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
            if [ -z "$SETTINGS" ]; then
              echo "settings.gradle bulunamadı!"
              find project -maxdepth 5 -type f | sort
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          fi

      - name: FIX PredictionStore JSONException
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/bistaitrader/PredictionStore.java")
          s = p.read_text()

          old = '''        boolean changed=false;
        for(int i=0;i<a.length();i++){JSONObject p=a.optJSONObject(i);if(p==null)continue;Double price=prices.get(p.optString("symbol"));if(price==null||price<=0)continue;double entry=p.optDouble("entry",0);if(entry<=0)continue;double ret=(price/entry-1)*100.0;p.put("lastQuote",price);p.put("lastQuoteTime",now);p.put("maxFavPct",Math.max(p.optDouble("maxFavPct",0),ret));p.put("maxAdvPct",Math.min(p.optDouble("maxAdvPct",0),ret));changed=true;}
        if(changed)write("open",a);'''

          new = '''        boolean changed=false;
        for(int i=0;i<a.length();i++){
            try{
                JSONObject p=a.optJSONObject(i);
                if(p==null)continue;
                Double price=prices.get(p.optString("symbol"));
                if(price==null||price<=0)continue;
                double entry=p.optDouble("entry",0);
                if(entry<=0)continue;
                double ret=(price/entry-1)*100.0;
                p.put("lastQuote",price);
                p.put("lastQuoteTime",now);
                p.put("maxFavPct",Math.max(p.optDouble("maxFavPct",0),ret));
                p.put("maxAdvPct",Math.min(p.optDouble("maxAdvPct",0),ret));
                changed=true;
            }catch(org.json.JSONException ignored){}
        }
        if(changed)write("open",a);'''

          if old not in s:
              print("Beklenen PredictionStore bloğu bulunamadı.")
              raise SystemExit(1)

          p.write_text(s.replace(old, new))
          print("PredictionStore.java JSONException düzeltildi.")
          PY

      - name: Verify PredictionStore source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -n '55,95p' app/src/main/java/com/bistaitrader/PredictionStore.java

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean --stacktrace --no-daemon
          else
            gradle clean --stacktrace --no-daemon
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        run: |
          find "${PROJECT_DIR}/app/build/outputs" -type f \( -name "*.apk" -o -name "*.aab" \) -print
          if ! find "${PROJECT_DIR}/app/build/outputs" -type f -name "*.apk" | grep -q .; then
            echo "APK oluşturulamadı!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIST-AI-Trader-V3.5-FIXED-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
