name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub deposunu indir
        uses: actions/checkout@v4

      - name: V2 ZIP dosyasını çıkar
        run: |
          unzip -q "BIST_AI_Trader_v2_FIXED.zip" -d project

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK lisanslarını kabul et
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Android SDK paketlerini kur
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: V2 APK oluştur
        working-directory: project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: BIST-AI-Trader-V2-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk