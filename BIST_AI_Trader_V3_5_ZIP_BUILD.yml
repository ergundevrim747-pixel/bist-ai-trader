name: BIST AI Trader V3.5 - Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="BIST_AI_Trader_V3_5_GITHUB_READY.zip"
          test -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          echo "ZIP OK: $ZIP"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project
          unzip -q "BIST_AI_Trader_V3_5_GITHUB_READY.zip" -d project

          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml

          echo "Project extracted successfully"
          find project -maxdepth 2 -type f | sort | head -100

      - name: Java preflight
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn --include='*.java' 'Locale\.TR' app/src/main/java; then
            echo "ERROR: Locale.TR found"
            exit 1
          fi

          test -f app/src/main/java/com/bistaitrader/PredictionStore.java
          grep -q 'putQuiet' app/src/main/java/com/bistaitrader/PredictionStore.java

          echo "Java preflight OK"

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle clean :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK CREATED SUCCESSFULLY"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIST-AI-Trader-V3.5-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
