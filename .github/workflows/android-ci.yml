name: Android CI - Debug Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Name of the project zip file kept at the repo root.
  PROJECT_ZIP: BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip
  PROJECT_DIR: project

jobs:
  build-debug:
    name: Build & Lint Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          rm -rf "${PROJECT_DIR}"
          unzip -q "${PROJECT_ZIP}" -d "${PROJECT_DIR}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew || true

      - name: Run Android Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:lintDebug --stacktrace
          else
            gradle :app:lintDebug --stacktrace
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BIST-AI-Trader-debug-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
