name: BIST AI Trader V3.9 - Adaptive AL FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="BIST_AI_Trader_V3_9_ADAPTIVE_AL_FIXED.zip"

          echo "Repository files:"
          find . -maxdepth 2 -type f | sort

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP bulunamadı!"
            echo "GitHub repository kök dizinindeki ZIP dosyalarını kontrol edin:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP bulundu:"
          ls -lh "$ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="BIST_AI_Trader_V3_9_ADAPTIVE_AL_FIXED.zip"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Extracted project files:"
          find project -maxdepth 3 -type f | sort | head -200

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

          echo "Android project extracted successfully"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"