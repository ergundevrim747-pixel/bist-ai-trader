name: Build BIST AI Trader V5

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/**'
      - 'project/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1 - REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2 - FIND / EXTRACT PROJECT
      # =========================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "REPOSITORY CONTENTS"
          echo "========================================"

          find . -maxdepth 3 -type f | sort | head -300

          echo ""
          echo "========================================"
          echo "LOCATING ANDROID PROJECT"
          echo "========================================"

          # Project already extracted
          if [ -f "app/build.gradle" ]; then
            echo "Android project found in repository root."
            echo "WORKDIR=." >> "$GITHUB_ENV"

          # Project inside project/
          elif [ -f "project/app/build.gradle" ]; then
            echo "Android project found in project/."
            echo "WORKDIR=project" >> "$GITHUB_ENV"

          else
            echo "Android project not extracted."
            echo "Searching for V5 ZIP..."

            ZIP_FILE=$(find . -maxdepth 2 -type f \
              -iname 'BIST_AI_Trader_V5*.zip' \
              -o -iname '*V5*FEATURES*.zip' \
              -o -iname '*BIST*Trader*.zip' \
              | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo ""
              echo "ERROR: Android project veya V5 ZIP bulunamadı."
              echo ""
              echo "Bulunan ZIP dosyaları:"
              find . -type f -iname '*.zip' | sort || true
              exit 1
            fi

            echo "ZIP bulundu:"
            echo "$ZIP_FILE"

            rm -rf project
            mkdir -p project

            echo ""
            echo "ZIP açılıyor..."

            unzip -q "$ZIP_FILE" -d project

            echo ""
            echo "ZIP sonrası yapı:"
            find project -maxdepth 4 -type f | sort | head -300

            #