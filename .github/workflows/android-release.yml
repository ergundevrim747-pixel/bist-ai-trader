name: Android Release - Signed APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for manual release (e.g. 3.6.0)"
        required: false
        default: ""

env:
  # Name of the project zip file kept at the repo root.
  PROJECT_ZIP: BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip
  PROJECT_DIR: project

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          rm -rf "${PROJECT_DIR}"
          unzip -q "${PROJECT_ZIP}" -d "${PROJECT_DIR}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew || true

      # If you add signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD) in repo Settings -> Secrets -> Actions,
      # this step decodes the keystore so the release build can sign the APK.
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Find release APK
        id: find_apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=${PROJECT_DIR}/$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIST-AI-Trader-release-${{ github.ref_name }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
