name: BIST AI Trader V3.5 - READY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "BIST_AI_Trader_V3_5_READY.zip"
          test -f "BIST_AI_Trader_V3_5_READY_WORKFLOW.yml"
          unzip -t "BIST_AI_Trader_V3_5_READY.zip" >/dev/null
          echo "Archive OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract clean project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q "BIST_AI_Trader_V3_5_READY.zip" -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml

      - name: Preflight source checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.java' 'Locale\.TR' app/src/main/java; then
            echo "Unsupported Locale.TR reference found."
            exit 1
          fi
          grep -q 'putQuiet' app/src/main/java/com/bistaitrader/PredictionStore.java
          echo "Preflight OK"

      - name: Clean build
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle clean --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIST-AI-Trader-V3.5-READY-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
