name: BIST AI Trader V3.5 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1 — Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3 — Android SDK lisansları
      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # 4 — Android SDK
      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5 — Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 6 — V3.5 ZIP'ini aç
      - name: Extract V3.5 project
        run: |
          rm -rf project
          mkdir -p project

          if [ -f "BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip" ]; then
            unzip -q "BIST_AI_Trader_V3_5_SELF_LEARNING_CONTINUOUS.zip" -d project
          else
            echo "V3.5 ZIP bulunamadı!"
            echo "Repository içeriği:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

      # 7 — ZIP iç içe klasör oluşturduysa gerçek proje klasörünü bul
      - name: Locate Android project
        run: |
          echo "Project contents:"
          find project -maxdepth 4 -type f | sort | head -300

          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            exit 0
          fi

          SETTINGS=$(find project -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 8 — Gradle wrapper varsa kontrol et
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper bulundu."
          else
            echo "Gradle wrapper yok. Sistem Gradle kullanılacak."
          fi

      # 9 — Temiz derleme
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean --stacktrace
          else
            gradle clean --stacktrace
          fi

      # 10 — Android APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      # 11 — APK'yı bul
      - name: Find APK
        run: |
          echo "APK files:"
          find "${PROJECT_DIR}/app/build/outputs" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          if ! find "${PROJECT_DIR}/app/build/outputs" \
            -type f -name "*.apk" | grep -q .; then
            echo "APK oluşturulamadı!"
            exit 1
          fi

      # 12 — APK'yı GitHub Actions Artifact olarak yükle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIST-AI-Trader-V3.5-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30